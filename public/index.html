<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fourth & Pick V7.3</title><style>
:root{--bg:#020914;--panel:#07182a;--panel2:#0b2239;--line:#1e4b70;--blue:#169cff;--text:#f4f9ff;--muted:#8ea9c1;--gold:#ffc542;--green:#3be08f;--red:#ff5f68}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:radial-gradient(circle at 50% -20%,#123e70 0,#061425 35%,#020914 70%);color:var(--text);min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,transparent 49.8%,#ffffff08 50%,transparent 50.2%),linear-gradient(#ffffff05 1px,transparent 1px);background-size:100% 100%,100% 80px;pointer-events:none}.wrap{max-width:1500px;margin:auto;padding:18px}.header{display:flex;align-items:center;gap:18px;padding:12px 0 18px;border-bottom:1px solid #2270aa}.logo{width:240px;max-width:42vw}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.nav button,.btn{background:#081b2e;border:1px solid #2b587c;color:#fff;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}.nav button.active,.btn.primary{background:linear-gradient(180deg,#20a8ff,#0878e9);border-color:#52bdff;box-shadow:0 0 20px #149cff44}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:18px 0;padding:22px;background:linear-gradient(120deg,#0a2037dd,#06111ddd);border:1px solid #285d86;border-radius:14px;box-shadow:0 16px 40px #0008}.hero h1{font-size:34px;margin:3px 0}.eyebrow{color:#62bfff;font-weight:900;letter-spacing:2px;font-size:12px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mode{background:linear-gradient(145deg,#0a1e33,#05111f);border:1px solid #24557b;border-radius:14px;padding:18px;min-height:160px;cursor:pointer;transition:.18s}.mode:hover{transform:translateY(-2px);border-color:#4fb9ff;box-shadow:0 12px 30px #0008}.mode .icon{font-size:31px}.mode h3{font-size:21px;margin:9px 0 5px}.mode .tag{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#0e3151;color:#8ed0ff;font-size:11px;font-weight:900}.panel{margin-top:16px;background:#061625e8;border:1px solid #25587f;border-radius:14px;padding:18px}.panel h2{margin-top:0}.gamegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game{border:1px solid #244c6c;border-radius:12px;background:#081a2b;padding:13px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{display:flex;align-items:center;gap:10px;background:#0b2237;border:1px solid #315f81;border-radius:10px;padding:12px;color:#fff;font-weight:900;cursor:pointer}.team img{width:46px;height:46px;object-fit:contain}.team.sel,.mode.sel{border-color:#52bdff!important;background:linear-gradient(145deg,#0d6eb5,#073e70)!important;box-shadow:0 0 0 2px #169cff,0 0 24px #129cff77!important;transform:translateY(-1px)}.team.sel:after,.mode.sel:after{content:"✓ SELECTED";margin-left:auto;color:#fff;font-size:11px;font-weight:950;letter-spacing:.5px}.team:disabled{opacity:.55;cursor:not-allowed}.input{width:100%;background:#06121e;border:1px solid #315b7b;color:#fff;border-radius:8px;padding:10px}.rank{display:grid;grid-template-columns:38px 1fr auto;gap:10px;padding:10px;border-bottom:1px solid #173852}.pill{display:inline-block;padding:5px 8px;border:1px solid #315b7b;border-radius:999px;margin:3px;font-size:12px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.weeks{display:flex;gap:5px;overflow:auto;padding:9px 0}.weeks button{min-width:38px;padding:8px;border-radius:7px;background:#081b2e;border:1px solid #254b6a;color:#fff}.weeks button.active{background:#168fea}.scorebox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.score{background:#0a2034;border:1px solid #285578;border-radius:10px;padding:13px}.score b{font-size:24px}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}.squaregrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:680px}.sq{aspect-ratio:1;background:#0a2339;border:1px solid #2c5a7c;border-radius:4px;color:#8ccfff;font-size:10px;display:grid;place-items:center;cursor:pointer}.sq.on{background:#157dcc;color:#fff}.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.round{border-left:2px solid #24577e;padding-left:10px}.round div{background:#0a2136;border:1px solid #28587d;border-radius:8px;padding:9px;margin:8px 0}.settings label{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #173852}.footer{padding:30px 0;text-align:center;color:#6f8ca5}.liveDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4050;box-shadow:0 0 12px #ff4050;margin-right:6px}.livegame{background:linear-gradient(145deg,#0b2035,#050e18);border:1px solid #2a5e83;border-radius:14px;padding:16px}.livegame.on{border-color:#ff5360;box-shadow:0 0 20px #ff354522}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:12px 0}.scoreteam{text-align:center}.scoreteam img{width:58px;height:58px;object-fit:contain}.bigscore{font-size:32px;font-weight:950}.livegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.modalBack{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:99;padding:16px}.modal{width:min(460px,100%);background:#07182a;border:1px solid #3a7cab;border-radius:16px;padding:20px;box-shadow:0 25px 80px #000}.modal h2{margin-top:0}.modal .input{margin:7px 0 12px}.modalBtns{display:flex;gap:8px;justify-content:flex-end}.adminTable{width:100%;border-collapse:collapse}.adminTable th,.adminTable td{padding:10px;border-bottom:1px solid #173852;text-align:left}.adminTable th{color:#8ed0ff}.notice{padding:10px;border-radius:8px;background:#0b2943;border:1px solid #275f89;margin:10px 0}.mobileAccount{display:none}@media(max-width:580px){.mobileAccount{display:block;width:100%;margin-top:8px}.header{flex-direction:column}.logo{align-self:center}}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.two,.gamegrid{grid-template-columns:1fr}.header{align-items:flex-start}.nav{margin-left:0}.scorebox{grid-template-columns:1fr 1fr}.bracket{grid-template-columns:1fr 1fr}}@media(max-width:580px){.cards{grid-template-columns:1fr}.wrap{padding:10px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:27px}.logo{width:200px}.nav{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.nav button{padding:9px 6px;font-size:11px}.teams{grid-template-columns:1fr}.teams>span{text-align:center}.scorebox{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><header class="header"><img class="logo" src="fourth-and-pick-logo.png"><div class="nav"><button class="active" data-page="home">Game Hub</button><button data-page="pickem">Pick'em</button><button data-page="survivor">Survivor</button><button data-page="live">🔴 Live</button><button data-page="standings">Standings</button><button data-page="commissioner">Commissioner</button></div></header>
<section class="hero"><div><div class="eyebrow">V7.3 • ACCOUNTS + MY POOLS</div><h1 id="poolTitle">FOURTH & PICK</h1><div class="muted" id="status">Create a test pool or open an existing local pool.</div></div><div class="toolbar"><button class="btn primary" id="create">Create Pool</button><button class="btn" id="signin">Account / My Pools</button><button class="btn" id="share">Copy Pool Link</button></div></section>
<div id="weeks" class="weeks"></div>
<main id="content"></main><div class="footer">Fourth & Pick V7.3 • Accounts + My Pools</div></div>
<script>
const $=s=>document.querySelector(s), content=$('#content'), q=new URLSearchParams(location.search);let pool=q.get('pool'),week=3,data=null,me=localStorage.getItem('v7name:'+pool)||'',tok=localStorage.getItem('v7tok:'+pool)||'',extras={},accountToken=localStorage.getItem('fpAccountToken')||'',account=null;const logo=t=>`https://a.espncdn.com/i/teamlogos/nfl/500/${({WAS:'wsh'}[t]||t.toLowerCase())}.png`;
async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function fmt(x){return new Date(x).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}function post(u,b){return api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})}function team(t,sel=false){return `<img src="${logo(t)}" onerror="this.style.display='none'"><span>${t}</span>${sel?' ✓':''}`}
for(let i=1;i<=18;i++){let b=document.createElement('button');b.textContent=i;b.onclick=()=>{week=i;load().then(()=>show(current))};$('#weeks').append(b)}let current='home';
async function load(){if(!pool)return;data=await api(`/api/leagues/${pool}?week=${week}&name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`);extras=await api(`/api/leagues/${pool}/extras?name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`);$('#poolTitle').textContent=data.name+' • 2026';document.querySelectorAll('#weeks button').forEach((b,i)=>b.classList.toggle('active',i+1===week));$('#status').textContent=me?`Signed in as ${me} • Week ${week}`:`Week ${week} • Sign in to save entries`;}
const modes=[['pickem','🏈','Weekly Pick’em','Pick every NFL winner.','CORE'],['survivor','💀','Survivor','One team per week. Never reuse a team.','ELIMINATION'],['confidence','🔥','Confidence','Rank every pick by confidence points.','STRATEGY'],['ats','🎯','Against the Spread','Pick each matchup against a preview spread.','LINES'],['lock','⭐','Lock of the Week','Choose one featured pick for bonus points.','BONUS'],['squares','💯','NFL Squares','Claim squares on a 10×10 game board.','GAME DAY'],['doubleSurvivor','🛡️','Double-Elim Survivor','Survivor with two lives instead of one.','2 LIVES'],['upset','⚡','Upset Challenge','Earn bonus points for underdog picks.','BONUS'],['playoffs','🏆','Playoff Challenge','Build your road-to-the-championship bracket.','POSTSEASON'],['superBowl','🎆','Championship Challenge','Winner, score, MVP and fun predictions.','FINALE']];
async function refreshAccount(){if(!accountToken){account=null;return null}try{account=await api(`/api/account/me?token=${encodeURIComponent(accountToken)}`);return account}catch(e){accountToken='';account=null;localStorage.removeItem('fpAccountToken');return null}}
function accountLanding(){
  $('#poolTitle').textContent='FOURTH & PICK';$('#weeks').classList.add('hidden');
  if(!account){$('#status').textContent='Sign in once. See every pool you play in.';content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">ONE ACCOUNT • EVERY POOL</div><h2>Welcome to Fourth & Pick</h2><p class="muted">Sign in from the main page to see all of your Pick’em, Survivor and other pools in one place.</p><div class="toolbar"><button class="btn primary" onclick="accountModal('login')">Sign In</button><button class="btn" onclick="accountModal('register')">Create Account</button></div></section><aside class="panel"><h2>My Pools</h2><p class="muted">Your pools will appear here after you sign in.</p></aside></div>`;return}
  $('#status').textContent=`Signed in as ${account.displayName}`;
  let cards=(account.pools||[]).map(x=>`<div class="mode" onclick="openAccountPool('${x.id}')"><div class="icon">${x.role==='commissioner'?'👑':'🏈'}</div><h3>${x.name}</h3><div class="muted">${x.role==='commissioner'?'Commissioner':'Player'} • ${x.season}</div><span class="tag">OPEN POOL</span></div>`).join('');
  content.innerHTML=`<section class="panel"><div class="eyebrow">WELCOME BACK</div><h2>${account.displayName}'s Pools</h2><p class="muted">Choose any pool below. Your account stays signed in on this device.</p><div class="cards">${cards||'<div class="mode"><div class="icon">🏈</div><h3>No pools yet</h3><div class="muted">Create a pool or open an invite link to join one.</div></div>'}</div><div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="createPoolModal()">+ Create Pool</button><button class="btn" onclick="signOutAccount()">Sign Out</button></div></section>`;
}
async function mainHome(){await refreshAccount();if(pool){$('#weeks').classList.remove('hidden');if(account&&!account.pools?.some(x=>x.id===pool)){content.innerHTML=`<section class="panel"><div class="eyebrow">POOL INVITATION</div><h2>${data?.name||'Fourth & Pick Pool'}</h2><p class="muted">You are signed in as ${account.displayName}. Join this pool to add it to My Pools.</p><button class="btn primary" onclick="joinCurrentPool()">Join This Pool</button><button class="btn" onclick="goMyPools()">My Pools</button></section>`;return}poolHome()}else accountLanding()}
function accountModal(kind){let reg=kind==='register';document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="accountModal"><div class="modal"><div class="eyebrow">FOURTH & PICK ACCOUNT</div><h2>${reg?'Create Account':'Sign In'}</h2>${reg?'<label>Display name<input id="aDisplay" class="input" placeholder="Name shown in pools"></label>':''}<label>Username<input id="aUser" class="input" autocomplete="username" autocapitalize="none" placeholder="username"></label><label>Password<input id="aPass" class="input" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'6+ characters':'Password'}"></label><div class="modalBtns"><button class="btn" onclick="closeAccountModal()">Cancel</button><button class="btn primary" onclick="submitAccount('${kind}')">${reg?'Create Account':'Sign In'}</button></div></div></div>`);setTimeout(()=>$('#aUser')?.focus(),50)}
window.closeAccountModal=()=>$('#accountModal')?.remove();
window.submitAccount=async kind=>{try{let body={username:$('#aUser').value.trim(),password:$('#aPass').value};if(kind==='register')body.displayName=$('#aDisplay').value.trim();let j=await post(`/api/account/${kind==='register'?'register':'login'}`,body);accountToken=j.token;localStorage.setItem('fpAccountToken',accountToken);closeAccountModal();await refreshAccount();if(pool)await joinCurrentPool();else accountLanding()}catch(e){alert(e.message)}};
window.signOutAccount=()=>{accountToken='';account=null;localStorage.removeItem('fpAccountToken');accountLanding()};
window.goMyPools=()=>{pool=null;me='';tok='';history.replaceState({},'',location.pathname);accountLanding()};
window.openAccountPool=async id=>{try{let j=await post(`/api/account/pools/${id}/open`,{accountToken});pool=id;me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);history.replaceState({},'',`?pool=${pool}`);await load();show('home')}catch(e){alert(e.message)}};
window.joinCurrentPool=async pin=>{if(!account)return accountModal('login');try{let j=await post(`/api/account/pools/${pool}/join`,{accountToken,playerPin:pin||'',legacyName:me,legacyToken:tok});me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);await refreshAccount();await load();show('home')}catch(e){if(String(e.message).includes('old pool PIN'))return claimPoolModal();alert(e.message)}};
function claimPoolModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="claimModal"><div class="modal"><div class="eyebrow">CLAIM EXISTING PLAYER</div><h2>One-time pool verification</h2><p class="muted">A player with your display name already exists here. Enter the old player PIN for this pool once. After that, it will appear in My Pools.</p><input id="claimPin" class="input" type="password" inputmode="numeric" placeholder="Old player PIN"><div class="modalBtns"><button class="btn" onclick="$('#claimModal').remove()">Cancel</button><button class="btn primary" onclick="let p=$('#claimPin').value;$('#claimModal').remove();joinCurrentPool(p)">Claim Pool</button></div></div></div>`)}
function createPoolModal(){if(!account)return accountModal('login');document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="createPoolModal"><div class="modal"><div class="eyebrow">NEW POOL</div><h2>Create a Pool</h2><label>Pool name<input id="newPoolName" class="input" value="Fourth & Pick"></label><label>Commissioner PIN<input id="newAdminPin" class="input" type="password" inputmode="numeric" placeholder="4+ characters"></label><label>Pool recovery PIN<input id="newPlayerPin" class="input" type="password" inputmode="numeric" placeholder="4+ characters"></label><p class="muted">The recovery PIN keeps compatibility with existing pool tools. Your main account is what you will normally use to sign in.</p><div class="modalBtns"><button class="btn" onclick="$('#createPoolModal').remove()">Cancel</button><button class="btn primary" onclick="submitNewPool()">Create Pool</button></div></div></div>`)}
window.submitNewPool=async()=>{try{let j=await post('/api/leagues',{name:$('#newPoolName').value.trim(),owner:account.displayName,playerPin:$('#newPlayerPin').value,pin:$('#newAdminPin').value,accountToken});pool=j.id;me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);$('#createPoolModal').remove();await refreshAccount();history.replaceState({},'',`?pool=${pool}`);await load();show('home')}catch(e){alert(e.message)}};
function poolHome(){content.innerHTML=`<section class="panel"><div class="eyebrow">CHOOSE YOUR GAME</div><h2>Pool Game Hub</h2><p class="muted">One league, multiple ways to play. Commissioner can enable or disable each mode.</p><div class="cards">${modes.map(m=>`<div class="mode" onclick="show('${m[0]}')"><div class="icon">${m[1]}</div><h3>${m[2]}</h3><div class="muted">${m[3]}</div><span class="tag">${m[4]}</span></div>`).join('')}</div></section>`}
function pickem(){window.pickDrafts=window.pickDrafts||{};let saved=data?.users?.[me]?.picks||{};if(!window.pickDrafts[week])window.pickDrafts[week]={...saved};let picks=window.pickDrafts[week];content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">WEEK ${week}</div><h2>Weekly Pick’em</h2><div class="gamegrid">${(data?.games||[]).map(g=>`<div class="game"><div class="teams"><button ${g.locked?'disabled':''} class="team ${picks[g.id]===g.away?'sel':''}" onclick="quickPick('${g.id}','${g.away}')">${team(g.away,picks[g.id]===g.away)}</button><span>AT</span><button ${g.locked?'disabled':''} class="team ${picks[g.id]===g.home?'sel':''}" onclick="quickPick('${g.id}','${g.home}')">${team(g.home,picks[g.id]===g.home)}</button></div><div class="muted">${fmt(g.kickoff)} ${g.locked?'• LOCKED':''}</div></div>`).join('')||'No schedule loaded.'}</div></section><aside class="panel"><h2>Week Status</h2><div class="scorebox"><div class="score"><b>${Object.keys(picks).length}</b><br><span class="muted">Picks</span></div><div class="score"><b>${data?.games?.length||0}</b><br><span class="muted">Games</span></div></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="savePickem()">Save Picks</button></aside></div>`}
window.quickPick=(id,t)=>{window.pickDrafts=window.pickDrafts||{};window.pickDrafts[week]=window.pickDrafts[week]||{};window.pickDrafts[week][id]=t;pickem()};window.savePickem=async()=>{if(!me)return alert('Sign in first');let picks=window.pickDrafts?.[week]||{};await post(`/api/leagues/${pool}/picks`,{name:me,token:tok,week,picks,tiebreaker:47});await load();window.pickDrafts[week]={...(data?.users?.[me]?.picks||{})};pickem();alert('Picks saved ✓')};
async function survivor(){content.innerHTML='<section class="panel"><h2>Loading Survivor…</h2></section>';let s=await api(`/api/leagues/${pool}/survivor?week=${week}&name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`),mine=s.players.find(x=>x.name===me);content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow gold">LAST TEAM STANDING</div><h2>💀 Survivor • Week ${week}</h2><p class="muted">Pick one winner. You cannot reuse a team.</p><div class="gamegrid">${s.games.flatMap(g=>[g.away,g.home].map(t=>`<button class="team ${mine?.currentPick===t?'sel':''}" onclick="saveSurv('${t}')">${team(t,mine?.currentPick===t)}<small>${g.away} @ ${g.home}</small></button>`)).join('')}</div></section><aside class="panel"><h2>Survivor Board</h2>${s.players.map((p,i)=>`<div class="rank"><b>${i+1}</b><span>${p.name}</span><b class="${p.alive?'green':'red'}">${p.alive?'ALIVE':'OUT'}</b></div>`).join('')}</aside></div>`}window.saveSurv=async t=>{if(!me)return alert('Sign in first');await post(`/api/leagues/${pool}/survivor`,{name:me,token:tok,week,pick:t});survivor()};
function generic(mode){let v=extras.data?.[mode]||{};const games=data?.games||[];if(mode==='confidence'){content.innerHTML=`<section class="panel"><div class="eyebrow">RANK YOUR CERTAINTY</div><h2>🔥 Confidence Pool</h2><p class="muted">Pick a winner and assign a unique confidence value. This preview uses 1–${games.length}.</p>${games.map((g,i)=>`<div class="game"><div class="teams"><button class="team ${v[g.id]?.pick===g.away?'sel':''}" onclick="setExtra('confidence','${g.id}','pick','${g.away}')">${team(g.away)}</button><span>AT</span><button class="team ${v[g.id]?.pick===g.home?'sel':''}" onclick="setExtra('confidence','${g.id}','pick','${g.home}')">${team(g.home)}</button></div><input class="input" type="number" min="1" max="${games.length}" value="${v[g.id]?.points||games.length-i}" onchange="setExtra('confidence','${g.id}','points',this.value)" placeholder="Confidence points"></div>`).join('')}<button class="btn primary" onclick="saveExtra('confidence')">Save Confidence Card</button></section>`}
else if(mode==='ats'){content.innerHTML=`<section class="panel"><div class="eyebrow">PREVIEW LINES • NOT LIVE ODDS</div><h2>🎯 Against the Spread</h2><p class="muted">Local-preview spreads are placeholders so you can test the experience. A production build would use a licensed/current odds source and freeze the line at lock.</p><div class="gamegrid">${games.map((g,i)=>{let sp=((i%7)-3.5).toFixed(1);return `<div class="game"><div class="teams"><button class="team ${v[g.id]===g.away?'sel':''}" onclick="setSimple('ats','${g.id}','${g.away}')">${team(g.away)} <small>${sp}</small></button><span>VS</span><button class="team ${v[g.id]===g.home?'sel':''}" onclick="setSimple('ats','${g.id}','${g.home}')">${team(g.home)} <small>${(-sp).toFixed(1)}</small></button></div></div>`}).join('')}</div><button class="btn primary" onclick="saveExtra('ats')">Save ATS Picks</button></section>`}
else if(mode==='lock'){content.innerHTML=`<section class="panel"><div class="eyebrow gold">BONUS PICK</div><h2>⭐ Lock of the Week</h2><p class="muted">Choose the one team you trust most this week.</p><div class="cards">${games.flatMap(g=>[g.away,g.home].map(t=>`<div class="mode ${v['week'+week]===t?'sel':''}" onclick="setSimple('lock','week${week}','${t}')"><div class="icon"><img src="${logo(t)}" style="width:70px;height:70px;object-fit:contain"></div><h3>${t}</h3><div class="muted">${g.away} @ ${g.home}</div></div>`)).join('')}</div><button class="btn primary" onclick="saveExtra('lock')">Save Lock</button></section>`}
else if(mode==='squares'){content.innerHTML=`<section class="panel"><div class="eyebrow">GAME-DAY BOARD</div><h2>💯 NFL Squares</h2><p class="muted">Click squares to claim them in this local preview. Commissioner number randomization can be added for production.</p><div class="squaregrid">${Array.from({length:100},(_,i)=>`<button class="sq ${v[i]?'on':''}" onclick="toggleSquare(${i})">${v[i]?'YOU':i+1}</button>`).join('')}</div><button class="btn primary" style="margin-top:12px" onclick="saveExtra('squares')">Save Squares</button></section>`}
else if(mode==='doubleSurvivor'){content.innerHTML=`<section class="panel"><div class="eyebrow gold">TWO LIVES</div><h2>🛡️ Double-Elimination Survivor</h2><p class="muted">Same Survivor concept, but your season ends after your second losing selection.</p><div class="scorebox"><div class="score"><b>2</b><br>Lives at start</div><div class="score"><b>${v.losses||0}</b><br>Losses</div></div><div class="cards" style="margin-top:14px">${games.flatMap(g=>[g.away,g.home].map(t=>`<div class="mode ${v['week'+week]===t?'sel':''}" onclick="setSimple('doubleSurvivor','week${week}','${t}')"><img src="${logo(t)}" style="width:65px"><h3>${t}</h3></div>`)).join('')}</div><button class="btn primary" onclick="saveExtra('doubleSurvivor')">Save Selection</button></section>`}
else if(mode==='upset'){content.innerHTML=`<section class="panel"><div class="eyebrow">CHASE THE UNDERDOG</div><h2>⚡ Upset Challenge</h2><p class="muted">Pick one underdog. Bigger preview spreads display larger bonus values.</p><div class="gamegrid">${games.map((g,i)=>{let dog=i%2?g.away:g.home,pts=2+(i%5);return `<button class="team ${v['week'+week]===dog?'sel':''}" onclick="setSimple('upset','week${week}','${dog}')">${team(dog)} <b class="gold">+${pts} BONUS</b></button>`}).join('')}</div><button class="btn primary" onclick="saveExtra('upset')">Save Upset Pick</button></section>`}
else if(mode==='playoffs'){content.innerHTML=`<section class="panel"><div class="eyebrow">ROAD TO THE CHAMPIONSHIP</div><h2>🏆 Playoff Challenge</h2><p class="muted">Visual bracket preview. Save your projected conference champions and title winner.</p><div class="bracket"><div class="round"><h3>Wild Card</h3><div>AFC Matchup</div><div>AFC Matchup</div><div>NFC Matchup</div><div>NFC Matchup</div></div><div class="round"><h3>Divisional</h3><div>Winner A</div><div>Winner B</div><div>Winner C</div><div>Winner D</div></div><div class="round"><h3>Conference</h3><input class="input" placeholder="AFC Champion" value="${v.afc||''}" onchange="setField('playoffs','afc',this.value)"><input class="input" style="margin-top:8px" placeholder="NFC Champion" value="${v.nfc||''}" onchange="setField('playoffs','nfc',this.value)"></div><div class="round"><h3>Champion</h3><input class="input" placeholder="Champion" value="${v.champion||''}" onchange="setField('playoffs','champion',this.value)"></div></div><button class="btn primary" onclick="saveExtra('playoffs')">Save Bracket</button></section>`}
else if(mode==='superBowl'){content.innerHTML=`<section class="panel"><div class="eyebrow gold">THE FINALE</div><h2>🎆 Championship Challenge</h2><div class="gamegrid"><label>Champion<input class="input" value="${v.winner||''}" onchange="setField('superBowl','winner',this.value)" placeholder="Team"></label><label>Final Score<input class="input" value="${v.score||''}" onchange="setField('superBowl','score',this.value)" placeholder="27-24"></label><label>MVP<input class="input" value="${v.mvp||''}" onchange="setField('superBowl','mvp',this.value)" placeholder="Player"></label><label>First TD<input class="input" value="${v.firstTD||''}" onchange="setField('superBowl','firstTD',this.value)" placeholder="Player"></label><label>Total Points<input class="input" type="number" value="${v.total||''}" onchange="setField('superBowl','total',this.value)"></label><label>Margin of Victory<input class="input" type="number" value="${v.margin||''}" onchange="setField('superBowl','margin',this.value)"></label></div><button class="btn primary" style="margin-top:14px" onclick="saveExtra('superBowl')">Save Championship Card</button></section>`}}
window.setField=(m,k,val)=>{extras.data[m]=extras.data[m]||{};extras.data[m][k]=val};window.setSimple=(m,k,val)=>{setField(m,k,val);generic(m)};window.setExtra=(m,id,k,val)=>{extras.data[m]=extras.data[m]||{};extras.data[m][id]=extras.data[m][id]||{};extras.data[m][id][k]=val;if(k==='pick')generic(m)};window.toggleSquare=i=>{extras.data.squares=extras.data.squares||{};extras.data.squares[i]=!extras.data.squares[i];generic('squares')};window.saveExtra=async m=>{if(!me)return alert('Sign in first');await post(`/api/leagues/${pool}/extras`,{name:me,token:tok,mode:m,value:extras.data[m]||{}});alert('Saved locally ✓')};
async function liveCenter(){content.innerHTML='<section class="panel"><h2><span class="liveDot"></span>Loading Live Game Center…</h2></section>';let l=await api(`/api/leagues/${pool}/live?week=${week}`);let liveGames=l.games.filter(g=>String(g.status).toLowerCase().includes('in')||String(g.statusDetail||'').toLowerCase().includes('quarter')||String(g.statusDetail||'').toLowerCase().includes('half'));content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow"><span class="liveDot"></span>LIVE GAME CENTER</div><h2>Week ${week} NFL Scoreboard</h2><p class="muted">Auto-refreshes every ${l.refreshSeconds}s. Last update ${new Date(l.updatedAt).toLocaleTimeString()}.</p><div class="livegrid">${l.games.map(g=>{let st=g.winner?'FINAL':(g.statusDetail||g.status||fmt(g.kickoff));let isLive=!g.winner&&g.locked&&String(g.status).toLowerCase()!=='pre';return `<div class="livegame ${isLive?'on':''}"><div class="muted">${isLive?'<span class="liveDot"></span>':''}${st}</div><div class="scoreline"><div class="scoreteam">${team(g.away)}<div class="bigscore">${g.awayScore??'-'}</div></div><b>—</b><div class="scoreteam">${team(g.home)}<div class="bigscore">${g.homeScore??'-'}</div></div></div>${g.clock?`<div class="muted">Q${g.period} • ${g.clock}</div>`:''}</div>`}).join('')||'No games loaded.'}</div></section><aside class="panel"><div class="eyebrow">LIVE POOL</div><h2>Projected Standings</h2><p class="muted">Final wins plus picks currently leading.</p>${l.standings.map((x,i)=>`<div class="rank"><b>${i+1}</b><span>${x.name}<br><small class="muted">${x.correct} final ✓ · ${x.leading} leading · ${x.wrong} wrong</small></span><b>${x.projected}</b></div>`).join('')}</aside></div>`;}
async function standings(){let r=await api(`/api/leagues/${pool}/standings`);content.innerHTML=`<section class="panel"><div class="eyebrow">SEASON LEADERBOARD</div><h2>Standings</h2>${r.map((x,i)=>`<div class="rank"><b>${i+1}</b><span>${x.name}</span><span><b>${x.wins}-${x.losses}</b> · ${(x.pct*100).toFixed(1)}%</span></div>`).join('')}</section>`}
function commissioner(){content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">COMMISSIONER CENTER</div><h2>Dashboard Login</h2><p class="muted">Enter the commissioner PIN to load player completion, game status, pool controls and result tools.</p><input class="input" id="cpin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Commissioner PIN"><button class="btn primary" style="margin-top:10px;width:100%" onclick="loadAdmin()">Open Commissioner Dashboard</button><div id="adminArea"></div></section><aside class="panel"><h2>Commissioner Tools</h2><p class="muted">The dashboard shows each player's weekly completion and lets you enable pool modes or override a final result when needed.</p></aside></div>`}
window.loadAdmin=async()=>{let pin=$('#cpin').value;if(!pin)return alert('Enter commissioner PIN');try{let a=await api(`/api/leagues/${pool}/admin-summary?week=${week}&pin=${encodeURIComponent(pin)}`);window.adminPin=pin;renderAdmin(a)}catch(e){alert(e.message)}};
function renderAdmin(a){let modesObj=extras.modes||{};$('#adminArea').innerHTML=`<div class="notice"><b>${a.pool}</b> • Week ${week} • ${a.players.length} players</div><h3>Player Pick Status</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>Player</th><th>Picks</th><th>Status</th></tr></thead><tbody>${a.players.map(x=>`<tr><td>${x.name}</td><td>${x.picked}/${x.total}</td><td class="${x.complete?'green':'gold'}">${x.complete?'✓ COMPLETE':'⚠ MISSING '+(x.total-x.picked)}</td></tr>`).join('')}</tbody></table></div><h3>Pool Modes</h3><div class="settings">${modes.map(m=>`<label><span>${m[1]} ${m[2]}</span><input type="checkbox" data-mode="${m[0]}" ${modesObj[m[0]]!==false?'checked':''}></label>`).join('')}</div><button class="btn primary" style="margin-top:10px" onclick="saveModes()">Save Pool Settings</button><h3 style="margin-top:22px">Manual Results</h3><p class="muted">Only use this if the automatic result is wrong or unavailable.</p>${a.games.map(g=>`<div class="game"><b>${g.away} @ ${g.home}</b><div class="muted">${fmt(g.kickoff)} ${g.locked?'• LOCKED':''}</div><select class="input adminResult" data-gid="${g.id}"><option value="">Automatic${g.winner?' ('+g.winner+')':''}</option><option value="${g.away}" ${g.winner===g.away?'selected':''}>${g.away}</option><option value="${g.home}" ${g.winner===g.home?'selected':''}>${g.home}</option></select></div>`).join('')}<button class="btn" style="margin-top:10px" onclick="saveResults()">Save Result Overrides</button>`}
window.saveModes=async()=>{let o={};document.querySelectorAll('[data-mode]').forEach(x=>o[x.dataset.mode]=x.checked);try{let j=await post(`/api/leagues/${pool}/modes`,{pin:window.adminPin,modes:o});extras.modes=j.modes;alert('Pool modes saved ✓')}catch(e){alert(e.message)}};
window.saveResults=async()=>{let results={};document.querySelectorAll('.adminResult').forEach(x=>results[x.dataset.gid]=x.value);try{await post(`/api/leagues/${pool}/results`,{pin:window.adminPin,results});alert('Result overrides saved ✓');loadAdmin()}catch(e){alert(e.message)}};
function authModal(kind){let create=kind==='create';document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="authModal"><div class="modal"><div class="eyebrow">${create?'CREATE LEAGUE':'PLAYER LOGIN'}</div><h2>${create?'Create Fourth & Pick Pool':'Join / Sign In'}</h2>${create?'<label>Pool name<input id="mPool" class="input" value="Fourth & Pick"></label>':''}<label>Your name<input id="mName" class="input" autocomplete="username" placeholder="Player name"></label><label>Player PIN<input id="mPlayerPin" class="input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4+ characters"></label>${create?'<label>Commissioner PIN<input id="mAdminPin" class="input" type="password" inputmode="numeric" placeholder="4+ characters"></label>':''}<div class="modalBtns"><button class="btn" onclick="closeAuth()">Cancel</button><button class="btn primary" onclick="submitAuth('${kind}')">${create?'Create Pool':'Sign In'}</button></div></div></div>`);setTimeout(()=>$('#mName')?.focus(),50)}
window.closeAuth=()=>$('#authModal')?.remove();
window.submitAuth=async kind=>{let n=$('#mName').value.trim(),pp=$('#mPlayerPin').value.trim();if(!n||pp.length<4)return alert('Enter your name and a player PIN of at least 4 characters.');try{if(kind==='create'){let name=$('#mPool').value.trim(),ap=$('#mAdminPin').value.trim();if(!name||ap.length<4)return alert('Enter a pool name and commissioner PIN of at least 4 characters.');let j=await post('/api/leagues',{name,owner:n,playerPin:pp,pin:ap});pool=j.id;me=j.name;tok=j.token}else{if(!pool)return alert('Open a pool invite link first.');let j=await post(`/api/leagues/${pool}/auth`,{name:n,pin:pp});me=j.name;tok=j.token}localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);history.replaceState({},'',`?pool=${pool}`);closeAuth();await load();show('home')}catch(e){alert(e.message)}};
async function show(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(!pool&&p!=='home')return mainHome();if(p==='home')await mainHome();else if(p==='pickem')pickem();else if(p==='survivor')await survivor();else if(p==='live')await liveCenter();else if(p==='standings')await standings();else if(p==='commissioner')commissioner();else generic(p)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));setInterval(()=>{if(current==='live'&&pool)liveCenter().catch(()=>{})},15000);
$('#create').onclick=()=>createPoolModal();$('#signin').onclick=()=>{if(accountToken){pool=null;history.replaceState({},'',location.pathname);mainHome()}else accountModal('login')};$('#share').onclick=()=>pool?navigator.clipboard?.writeText(location.href).then(()=>alert('Pool link copied')):alert('Open a pool first');
(async()=>{await refreshAccount();if(pool){try{await load()}catch(e){$('#status').textContent=e.message}}await mainHome()})();
</script></body></html>
