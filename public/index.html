ARI:['#97233F','#000000','CARDINALS'],ATL:['#A71930','#000000','FALCONS'],BAL:['#241773','#000000','RAVENS'],BUF:['#00338D','#C60C30','BILLS'],CAR:['#0085CA','#101820','PANTHERS'],CHI:['#0B162A','#C83803','BEARS'],CIN:['#FB4F14','#000000','BENGALS'],CLE:['#311D00','#FF3C00','BROWNS'],DAL:['#003594','#869397','COWBOYS'],DEN:['#FB4F14','#002244','BRONCOS'],DET:['#0076B6','#B0B7BC','LIONS'],GB:['#203731','#FFB612','PACKERS'],HOU:['#03202F','#A71930','TEXANS'],IND:['#002C5F','#A2AAAD','COLTS'],JAX:['#006778','#101820','JAGUARS'],KC:['#E31837','#FFB81C','CHIEFS'],LV:['#000000','#A5ACAF','RAIDERS'],LAC:['#0080C6','#FFC20E','CHARGERS'],LA:['#003594','#FFA300','RAMS'],LAR:['#003594','#FFA300','RAMS'],MIA:['#008E97','#FC4C02','DOLPHINS'],MIN:['#4F2683','#FFC62F','VIKINGS'],NE:['#002244','#C60C30','PATRIOTS'],NO:['#D3BC8D','#101820','SAINTS'],NYG:['#0B2265','#A71930','GIANTS'],NYJ:['#125740','#000000','JETS'],PHI:['#004C54','#A5ACAF','EAGLES'],PIT:['#101820','#FFB612','STEELERS'],SF:['#AA0000','#B3995D','49ERS'],SEA:['#002244','#69BE28','SEAHAWKS'],TB:['#D50A0A','#34302B','BUCCANEERS'],TEN:['#0C2340','#4B92DB','TITANS'],WAS:['#5A1414','#FFB612','COMMANDERS']};
function fieldTheme(t){let x=NFL_FIELD_THEMES[t]||['#123b26','#0a2518',String(t||'HOME')];return{primary:x[0],secondary:x[1],name:x[2],logo:logo(t)}}
function applyFieldTheme(field,home){if(!field)return;let t=fieldTheme(home);field.style.background=`linear-gradient(90deg,${t.primary} 0 8%,#0b522d 8% 92%,${t.primary} 92% 100%)`;field.querySelectorAll('.teamEndzone').forEach(z=>{z.style.background=`linear-gradient(135deg,${t.primary},${t.secondary})`;z.style.borderColor=t.secondary});let mid=field.querySelector('.teamFieldLogo');if(mid)mid.src=t.logo;field.querySelectorAll('.teamEndzone img').forEach(i=>i.src=t.logo);let nm=field.querySelector('.teamFieldName');if(nm)nm.textContent=t.name+' FIELD'}
async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function fmt(x){return new Date(x).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}function post(u,b){return api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})}function team(t,sel=false){return `<img src="${logo(t)}" onerror="this.style.display='none'"><span>${t}</span>${sel?' ✓':''}`}
for(let i=1;i<=18;i++){let b=document.createElement('button');b.textContent=i;b.onclick=()=>{week=i;load().then(()=>show(current))};$('#weeks').append(b)}let current='home';
async function load(){if(!pool)return;data=await api(`/api/leagues/${pool}?week=${week}&name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`);extras=await api(`/api/leagues/${pool}/extras?name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`);$('#poolTitle').textContent=data.name+' • 2026';document.querySelectorAll('#weeks button').forEach((b,i)=>b.classList.toggle('active',i+1===week));$('#status').textContent=me?`Signed in as ${me} • Week ${week}`:`Week ${week} • Sign in to save entries`;if(data.announcement){document.body.dataset.announcement=data.announcement}else delete document.body.dataset.announcement;}
const modes=[['pickem','🏈','Weekly Pick’em','Pick every NFL winner.','CORE'],['survivor','💀','Survivor','One team per week. Never reuse a team.','ELIMINATION'],['confidence','🔥','Confidence','Rank every pick by confidence points.','STRATEGY'],['ats','🎯','Against the Spread','Pick each matchup against a preview spread.','LINES'],['lock','⭐','Lock of the Week','Choose one featured pick for bonus points.','BONUS'],['squares','💯','NFL Squares','Claim squares on a 10×10 game board.','GAME DAY'],['doubleSurvivor','🛡️','Double-Elim Survivor','Survivor with two lives instead of one.','2 LIVES'],['upset','⚡','Upset Challenge','Earn bonus points for underdog picks.','BONUS'],['playoffs','🏆','Playoff Challenge','Build your road-to-the-championship bracket.','POSTSEASON'],['superBowl','🎆','Championship Challenge','Winner, score, MVP and fun predictions.','FINALE']];
async function refreshAccount(){if(!accountToken){account=null;return null}try{account=await api(`/api/account/me?token=${encodeURIComponent(accountToken)}`);return account}catch(e){accountToken='';account=null;localStorage.removeItem('fpAccountToken');return null}}
function accountLanding(){
  $('#poolTitle').textContent='FOURTH & PICK';$('#weeks').classList.add('hidden');
  if(!account){$('#status').textContent='Sign in once. See every pool you play in.';content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">ONE ACCOUNT • EVERY POOL</div><h2>Welcome to Fourth & Pick</h2><p class="muted">Sign in from the main page to see all of your Pick’em, Survivor and other pools in one place.</p><div class="toolbar"><button class="btn primary" onclick="accountModal('login')">Sign In</button><button class="btn" onclick="accountModal('register')">Create Account</button></div></section><aside class="panel"><h2>My Pools</h2><p class="muted">Your pools will appear here after you sign in.</p></aside></div>`;return}
  $('#status').textContent=`Signed in as ${account.displayName}`;
  let cards=(account.pools||[]).map(x=>`<div class="mode"><div onclick="openAccountPool('${x.id}')" style="cursor:pointer"><div class="icon">${x.role==='commissioner'?'👑':'🏈'}</div><h3>${x.name}</h3><div class="muted">${x.role==='commissioner'?'Commissioner':'Player'} • ${x.season}</div><span class="tag">OPEN POOL</span></div><button class="btn" style="margin-top:12px;width:100%" onclick="leavePool('${x.id}','${x.name.replace(/'/g,"\'")}','${x.role}')">Leave Pool</button></div>`).join('');
  content.innerHTML=`<section class="panel"><div class="eyebrow">WELCOME BACK</div><h2>${account.displayName}'s Pools</h2><p class="muted">Choose any pool below. Your account stays signed in on this device.</p><div class="cards">${cards||'<div class="mode"><div class="icon">🏈</div><h3>No pools yet</h3><div class="muted">Create a pool or open an invite link to join one.</div></div>'}</div><div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="createPoolModal()">+ Create Pool</button><button class="btn" onclick="findPoolModal()">🔎 Find / Join Pool</button><button class="btn" onclick="linkPoolModal()">Link Existing Pool</button><button class="btn" onclick="signOutAccount()">Sign Out</button></div></section>`;
}
function findPoolModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="findPoolModal"><div class="modal"><div class="eyebrow">POOL DISCOVERY</div><h2>Find a Pool</h2><p class="muted">Search by exact pool code or pool name. Invite-only pools can only be found by code.</p><label>Pool name or code<input id="poolSearchQ" class="input" placeholder="Example: FAMILY or A1B2C3D4"></label><button class="btn primary" style="width:100%;margin-top:10px" onclick="searchPools()">Search Pools</button><div id="poolSearchResults" style="margin-top:14px"></div><div class="modalBtns"><button class="btn" onclick="$('#findPoolModal').remove()">Close</button></div></div></div>`)}
window.searchPools=async()=>{let q=$('#poolSearchQ').value.trim();if(q.length<2)return alert('Enter at least 2 characters.');try{let j=await api(`/api/account/pools/search?token=${encodeURIComponent(accountToken)}&q=${encodeURIComponent(q)}`);$('#poolSearchResults').innerHTML=j.results.length?j.results.map(x=>`<div class="notice"><b>${x.name}</b><div class="muted">${x.members} members • ${x.privacy==='public'?'Public':x.privacy==='searchable'?'Approval required':'Invite only'} • Code ${x.code}</div><button class="btn primary" style="margin-top:8px" ${x.joined?'disabled':''} onclick="joinFoundPool('${x.id}')">${x.joined?'Already Joined':x.approvalRequired?'Request to Join':'Join Pool'}</button></div>`).join(''):'<div class="notice">No matching pools found. Check the pool code with your commissioner.</div>'}catch(e){alert(e.message)}};
window.joinFoundPool=async id=>{try{let j=await post(`/api/account/pools/${id}/discovery-join`,{accountToken});if(j.pending)alert('Join request sent to the commissioner ✓');else alert('Pool joined ✓');$('#findPoolModal')?.remove();await refreshAccount();accountLanding()}catch(e){alert(e.message)}};
window.leavePool=async(id,name,role)=>{if(!confirm(`Leave ${name}?\n\nYour historical picks and results will stay in the pool records, but it will be removed from My Pools.`))return;try{await post(`/api/account/pools/${id}/leave`,{accountToken});await refreshAccount();accountLanding();alert('You left the pool.')}catch(e){alert(e.message)}};
async function mainHome(){await refreshAccount();if(pool){$('#weeks').classList.remove('hidden');if(account&&!account.pools?.some(x=>x.id===pool)){content.innerHTML=`<section class="panel"><div class="eyebrow">POOL INVITATION</div><h2>${data?.name||'Fourth & Pick Pool'}</h2><p class="muted">You are signed in as ${account.displayName}. Join this pool to add it to My Pools.</p><button class="btn primary" onclick="joinCurrentPool()">Join This Pool</button><button class="btn" onclick="goMyPools()">My Pools</button></section>`;return}poolHome()}else accountLanding()}
function accountModal(kind){let reg=kind==='register';document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="accountModal"><div class="modal"><div class="eyebrow">FOURTH & PICK ACCOUNT</div><h2>${reg?'Create Account':'Sign In'}</h2>${reg?'<label>Display name<input id="aDisplay" class="input" placeholder="Name shown in pools"></label><label>Email for pick reminders<input id="aEmail" class="input" type="email" placeholder="you@example.com"></label>':''}<label>Username<input id="aUser" class="input" autocomplete="username" autocapitalize="none" placeholder="username"></label><label>Password<input id="aPass" class="input" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'6+ characters':'Password'}"></label><div class="modalBtns"><button class="btn" onclick="closeAccountModal()">Cancel</button><button class="btn primary" onclick="submitAccount('${kind}')">${reg?'Create Account':'Sign In'}</button></div></div></div>`);setTimeout(()=>$('#aUser')?.focus(),50)}
window.closeAccountModal=()=>$('#accountModal')?.remove();
window.submitAccount=async kind=>{try{let body={username:$('#aUser').value.trim(),password:$('#aPass').value};if(kind==='register'){body.displayName=$('#aDisplay').value.trim();body.email=$('#aEmail')?.value.trim()||'';}let j=await post(`/api/account/${kind==='register'?'register':'login'}`,body);accountToken=j.token;localStorage.setItem('fpAccountToken',accountToken);closeAccountModal();await refreshAccount();if(pool)await joinCurrentPool();else accountLanding()}catch(e){alert(e.message)}};
window.signOutAccount=()=>{accountToken='';account=null;localStorage.removeItem('fpAccountToken');accountLanding()};
window.goMyPools=()=>{pool=null;me='';tok='';history.replaceState({},'',location.pathname);accountLanding()};
window.openAccountPool=async id=>{try{let j=await post(`/api/account/pools/${id}/open`,{accountToken});pool=id;me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);history.replaceState({},'',`?pool=${pool}`);await load();show('home')}catch(e){alert(e.message)}};
window.finishPoolLink=async j=>{me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);await refreshAccount();history.replaceState({},'',`?pool=${pool}`);await load();show('home')};
window.joinCurrentPool=async()=>{if(!account)return accountModal('login');try{let j=await post(`/api/account/pools/${pool}/join`,{accountToken,browserName:me,legacyToken:tok});await finishPoolLink(j)}catch(e){if(String(e.message).includes('EXISTING_PLAYER_VERIFICATION_REQUIRED'))return claimPoolModal(account.displayName);alert(e.message)}};
window.claimExistingPlayer=async()=>{let legacyName=$('#claimName').value.trim(),playerPin=$('#claimPin').value;if(!legacyName||!playerPin)return alert('Enter the exact old player name and pool PIN.');try{let j=await post(`/api/account/pools/${pool}/join`,{accountToken,legacyName,playerPin,browserName:me,legacyToken:tok});$('#claimModal')?.remove();await finishPoolLink(j)}catch(e){alert(e.message)}};
function claimPoolModal(defaultName=''){document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="claimModal"><div class="modal"><div class="eyebrow">LINK OLD POOL</div><h2>Claim your existing player</h2><p class="muted">Your Fourth & Pick account name does not have to match your old pool name. Enter the exact player name and PIN you used in this pool. Your old picks and stats stay attached to that player.</p><label>Old pool player name<input id="claimName" class="input" value="${defaultName||''}" placeholder="Exact old player name"></label><label>Old player PIN<input id="claimPin" class="input" type="password" inputmode="numeric" placeholder="Old pool PIN"></label><div class="modalBtns"><button class="btn" onclick="$('#claimModal').remove()">Cancel</button><button class="btn primary" onclick="claimExistingPlayer()">Link Pool</button></div></div></div>`)}
function linkPoolModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="linkPoolModal"><div class="modal"><div class="eyebrow">LINK EXISTING POOL</div><h2>Add an old pool to My Pools</h2><p class="muted">Paste the pool invite link or enter its pool ID. Then verify the old player name and PIN.</p><label>Pool link or ID<input id="linkPoolValue" class="input" placeholder="https://.../?pool=1234abcd or 1234abcd"></label><div class="modalBtns"><button class="btn" onclick="$('#linkPoolModal').remove()">Cancel</button><button class="btn primary" onclick="startPoolLink()">Continue</button></div></div></div>`)}
window.startPoolLink=async()=>{let raw=$('#linkPoolValue').value.trim(),id=raw;try{if(raw.includes('://'))id=new URL(raw).searchParams.get('pool')||''}catch{}id=id.replace(/^.*pool=/,'').split('&')[0].trim();if(!id)return alert('Enter a valid pool link or pool ID.');try{await api(`/api/leagues/${encodeURIComponent(id)}?week=${week}`);pool=id;me=localStorage.getItem('v7name:'+pool)||'';tok=localStorage.getItem('v7tok:'+pool)||'';$('#linkPoolModal')?.remove();history.replaceState({},'',`?pool=${pool}`);await load();claimPoolModal(me||account?.displayName||'')}catch(e){alert('Pool not found. Check the invite link or pool ID.')}};
function createPoolModal(){if(!account)return accountModal('login');document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="createPoolModal"><div class="modal"><div class="eyebrow">NEW POOL</div><h2>Create a Pool</h2><label>Pool name<input id="newPoolName" class="input" value="Fourth & Pick"></label><label>Commissioner PIN<input id="newAdminPin" class="input" type="password" inputmode="numeric" placeholder="4+ characters"></label><label>Pool recovery PIN<input id="newPlayerPin" class="input" type="password" inputmode="numeric" placeholder="4+ characters"></label><p class="muted">The recovery PIN keeps compatibility with existing pool tools. Your main account is what you will normally use to sign in.</p><div class="modalBtns"><button class="btn" onclick="$('#createPoolModal').remove()">Cancel</button><button class="btn primary" onclick="submitNewPool()">Create Pool</button></div></div></div>`)}
window.submitNewPool=async()=>{try{let j=await post('/api/leagues',{name:$('#newPoolName').value.trim(),owner:account.displayName,playerPin:$('#newPlayerPin').value,pin:$('#newAdminPin').value,accountToken});pool=j.id;me=j.name;tok=j.token;localStorage.setItem('v7name:'+pool,me);localStorage.setItem('v7tok:'+pool,tok);$('#createPoolModal').remove();await refreshAccount();history.replaceState({},'',`?pool=${pool}`);await load();show('home')}catch(e){alert(e.message)}};
function poolHome(){content.innerHTML=`<section class="panel"><div class="eyebrow">CHOOSE YOUR GAME</div><h2>Pool Game Hub</h2><p class="muted">One league, multiple ways to play. Commissioner can enable or disable each mode.</p><button class="btn primary" onclick="v82Hub()">⚡ Open V8.2 Game Day Hub</button><div class="cards">${modes.map(m=>`<div class="mode" onclick="show('${m[0]}')"><div class="icon">${m[1]}</div><h3>${m[2]}</h3><div class="muted">${m[3]}</div><span class="tag">${m[4]}</span></div>`).join('')}</div></section>`}
function pickem(){window.pickDrafts=window.pickDrafts||{};let saved=data?.users?.[me]?.picks||{};if(!window.pickDrafts[week])window.pickDrafts[week]={...saved};let picks=window.pickDrafts[week],games=data?.games||[],picked=games.filter(g=>picks[g.id]).length,complete=games.length>0&&picked===games.length;content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">WEEK ${week}</div><h2>Weekly Pick’em</h2>${complete?'<div class="pickCompleteBadge">✓ ALL '+games.length+' PICKS SELECTED</div>':''}<div class="gamegrid">${games.map(g=>`<div class="game"><div class="teams"><button ${g.locked?'disabled':''} class="team ${picks[g.id]===g.away?'sel':''}" onclick="quickPick('${g.id}','${g.away}')">${team(g.away,picks[g.id]===g.away)}</button><span>AT</span><button ${g.locked?'disabled':''} class="team ${picks[g.id]===g.home?'sel':''}" onclick="quickPick('${g.id}','${g.home}')">${team(g.home,picks[g.id]===g.home)}</button></div><div class="muted">${fmt(g.kickoff)} ${g.locked?'• LOCKED':''}</div></div>`).join('')||'No schedule loaded.'}</div></section><aside class="panel"><h2>Week Status</h2><div class="scorebox"><div class="score"><b>${picked}</b><br><span class="muted">Picks</span></div><div class="score"><b>${games.length}</b><br><span class="muted">Games</span></div></div><button id="savePicksBtn" class="btn primary" style="margin-top:12px;width:100%" onclick="savePickem()">💾 Save Picks</button><div id="saveConfirmation" class="saveConfirm ${complete?'good':'warn'}">${complete?'✓ All picks selected — press Save Picks to confirm.':`${Math.max(0,games.length-picked)} pick${games.length-picked===1?'':'s'} still need a selection.`}</div></aside></div>`}
window.quickPick=(id,t)=>{window.pickDrafts=window.pickDrafts||{};window.pickDrafts[week]=window.pickDrafts[week]||{};window.pickDrafts[week][id]=t;pickem()};window.savePickem=async()=>{if(!me)return alert('Sign in first');let picks=window.pickDrafts?.[week]||{},btn=$('#savePicksBtn'),box=$('#saveConfirmation');if(btn){btn.disabled=true;btn.textContent='SAVING…'}if(box){box.className='saveConfirm saving';box.textContent='Saving your Week '+week+' picks…'}try{await post(`/api/leagues/${pool}/picks`,{name:me,token:tok,week,picks,tiebreaker:47});await load();window.pickDrafts[week]={...(data?.users?.[me]?.picks||{})};let games=data?.games||[],saved=data?.users?.[me]?.picks||{},count=games.filter(g=>saved[g.id]).length,complete=games.length>0&&count===games.length;pickem();let b=$('#saveConfirmation');if(b){b.className='saveConfirm '+(complete?'good':'warn');b.textContent=complete?'✓ ALL PICKS SAVED — Week '+week+' is complete.':`✓ Saved ${count} of ${games.length} picks. ${games.length-count} still need a selection.`}let toast=document.createElement('div');toast.className='saveToast';toast.textContent=complete?'✓ ALL PICKS SAVED':'✓ PICKS SAVED';document.body.appendChild(toast);setTimeout(()=>toast.remove(),3500)}catch(e){if(box){box.className='saveConfirm warn';box.textContent='Save failed: '+e.message}if(btn){btn.disabled=false;btn.textContent='💾 Save Picks'}}};
async function survivor(){content.innerHTML='<section class="panel"><h2>Loading Survivor…</h2></section>';let s=await api(`/api/leagues/${pool}/survivor?week=${week}&name=${encodeURIComponent(me)}&token=${encodeURIComponent(tok)}`),mine=s.players.find(x=>x.name===me);content.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow gold">LAST TEAM STANDING</div><h2>💀 Survivor • Week ${week}</h2><p class="muted">Pick one winner. You cannot reuse a team.</p><div class="gamegrid">${s.games.flatMap(g=>[g.away,g.home].map(t=>`<button class="team ${mine?.currentPick===t?'sel':''}" onclick="saveSurv('${t}')">${team(t,mine?.currentPick===t)}<small>${g.away} @ ${g.home}</small></button>`)).join('')}</div></section><aside class="panel"><h2>Survivor Board</h2>${s.players.map((p,i)=>`<div class="rank"><b>${i+1}</b><span>${p.name}</span><b class="${p.alive?'green':'red'}">${p.alive?'ALIVE':'OUT'}</b></div>`).join('')}</aside></div>`}window.saveSurv=async t=>{if(!me)return alert('Sign in first');await post(`/api/leagues/${pool}/survivor`,{name:me,token:tok,week,pick:t});survivor()};
function generic(mode){let v=extras.data?.[mode]||{};const games=data?.games||[];if(mode==='confidence'){content.innerHTML=`<section class="panel"><div class="eyebrow">RANK YOUR CERTAINTY</div><h2>🔥 Confidence Pool</h2><p class="muted">Pick a winner and assign a unique confidence value. This preview uses 1–${games.length}.</p>${games.map((g,i)=>`<div class="game"><div class="teams"><button class="team ${v[g.id]?.pick===g.away?'sel':''}" onclick="setExtra('confidence','${g.id}','pick','${g.away}')">${team(g.away)}</button><span>AT</span><button class="team ${v[g.id]?.pick===g.home?'sel':''}" onclick="setExtra('confidence','${g.id}','pick','${g.home}')">${team(g.home)}</button></div><input class="input" type="number" min="1" max="${games.length}" value="${v[g.id]?.points||games.length-i}" onchange="setExtra('confidence','${g.id}','points',this.value)" placeholder="Confidence points"></div>`).join('')}<button class="btn primary" onclick="saveExtra('confidence')">Save Confidence Card</button></section>`}
else if(mode==='ats'){content.innerHTML=`<section class="panel"><div class="eyebrow">PREVIEW LINES • NOT LIVE ODDS</div><h2>🎯 Against the Spread</h2><p class="muted">Local-preview spreads are placeholders so you can test the experience. A production build would use a licensed/current odds source and freeze the line at lock.</p><div class="gamegrid">${games.map((g,i)=>{let sp=((i%7)-3.5).toFixed(1);return `<div class="game"><div class="teams"><button class="team ${v[g.id]===g.away?'sel':''}" onclick="setSimple('ats','${g.id}','${g.away}')">${team(g.away)} <small>${sp}</small></button><span>VS</span><button class="team ${v[g.id]===g.home?'sel':''}" onclick="setSimple('ats','${g.id}','${g.home}')">${team(g.home)} <small>${(-sp).toFixed(1)}</small></button></div></div>`}).join('')}</div><button class="btn primary" onclick="saveExtra('ats')">Save ATS Picks</button></section>`}

async function rivalries(){

    const rows=sum.rows||[], names=rows.map(x=>x.name), pairs=[];
    for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){
      const a=rows[i],b=rows[j],ids=new Set([...Object.keys(a.picks||{}),...Object.keys(b.picks||{})]);let same=0,diff=0,aEdge=0,bEdge=0;

      const sa=stand.find(x=>x.name===a.name),sb=stand.find(x=>x.name===b.name);aEdge=(sa?.wins||0)-(sb?.wins||0);bEdge=-aEdge;

async function updateLiveHQ(){const bar=$('#liveHQGames'),stamp=$('#liveHQUpdated');if(!bar)return;if(!pool){bar.innerHTML='<div class="liveHQEmpty">Open a pool to see live NFL game information.</div>';return}try{const l=await api(`/api/leagues/${pool}/live?week=${week}`);const active=l.games.filter(g=>g.locked||g.winner).sort((a,b)=>Date.parse(a.kickoff)-Date.parse(b.kickoff));const upcoming=l.games.filter(g=>!g.locked).sort((a,b)=>Date.parse(a.kickoff)-Date.parse(b.kickoff));const shown=(active.length?active:upcoming).slice(0,8);bar.innerHTML=shown.map(g=>{const isFinal=!!g.winner,isLive=!isFinal&&g.locked,status=isFinal?'FINAL':isLive?(g.statusDetail||((g.period?'Q'+g.period+' ':'')+(g.clock||'LIVE'))):fmt(g.kickoff);return `<div class="liveHQGame ${isLive?'live':''} ${isFinal?'final':''}" onclick="gameCenter('${g.id}')" title="Open Game Detail Center"><div class="hqTop"><span>${isLive?'🔴 LIVE':isFinal?'FINAL':'UPCOMING'}</span><span>${status}</span></div><div class="hqTeams"><span>${g.away}</span><span class="hqScore">${g.awayScore??'-'}</span><span>${g.home}</span><span class="hqScore">${g.homeScore??'-'}</span></div></div>`}).join('')||'<div class="liveHQEmpty">No Week '+week+' games available yet.</div>';if(stamp)stamp.textContent='Updated '+new Date(l.updatedAt).toLocaleTimeString()+' • refreshes every '+l.refreshSeconds+'s'}catch(e){bar.innerHTML='<div class="liveHQEmpty">Live data temporarily unavailable — retrying automatically.</div>'}}
async function show(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(!pool&&p!=='home')return mainHome();if(p==='home')await mainHome();else if(p==='gameday')await gameDay();else if(p==='profile')await profile();else if(p==='awards')await awards();else if(p==='notifications')await notifications();else if(p==='insights')await insights();else if(p==='history')await historyPage();else if(p==='rivalries')await rivalries();else if(p==='activity')activityFeed();else if(p==='pickem')pickem();else if(p==='survivor')await survivor();else if(p==='live')await liveCenter();else if(p==='standings')await standings();else if(p==='commissioner')commissioner();else generic(p)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));setInterval(()=>{if(pool)updateLiveHQ().catch(()=>{});if((current==='live'||current==='gameday')&&pool){if(current==='live')liveCenter().catch(()=>{});else gameDay().catch(()=>{})}},15000);setTimeout(()=>updateLiveHQ().catch(()=>{}),500);
function inviteUrl(){return `${location.origin}${location.pathname}?pool=${encodeURIComponent(pool||'')}`}function joinCode(){return (pool||'').replace(/[^a-z0-9]/gi,'').slice(0,8).toUpperCase()||'--------'}
window.openInviteCenter=()=>{if(!pool)return alert('Open a pool first');let name=data?.name||'Fourth & Pick',url=inviteUrl(),code=joinCode();document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="inviteModal"><div class="modal"><div class="eyebrow">FOURTH & PICK • INVITE CENTER</div><h2>👥 Invite Players</h2><p class="muted">Bring friends and family into <b>${name}</b>.</p><div class="invitePreview"><strong>🏈 You're invited to ${name}!</strong><p>Join my Fourth & Pick pool and make your NFL picks each week.</p><div class="joinCode">${code}</div><small class="muted">POOL CODE</small></div><div class="inviteGrid"><button class="inviteAction" onclick="nativeInvite()"><b>📲 Share Invite</b><span class="muted">Messages, Messenger, apps & more</span></button><button class="inviteAction" onclick="emailInvite()"><b>✉️ Email Invite</b><span class="muted">Open your email app with invite ready</span></button><button class="inviteAction" onclick="textInvite()"><b>💬 Text Invite</b><span class="muted">Open your messaging app</span></button><button class="inviteAction" onclick="copyInvite()"><b>🔗 Copy Invite</b><span class="muted">Copy the join message and link</span></button></div><div class="modalBtns"><button class="btn" onclick="document.querySelector('#inviteModal').remove()">Close</button></div></div></div>`)};
function inviteMessage(){return `🏈 You've been invited to Fourth & Pick!\n\nJoin ${data?.name||'my pool'} and make your NFL picks each week.\n\nPool code: ${joinCode()}\nJoin here: ${inviteUrl()}`}
window.copyInvite=async()=>{try{await navigator.clipboard.writeText(inviteMessage());alert('Invite copied ✓')}catch{prompt('Copy this invite:',inviteMessage())}};
window.nativeInvite=async()=>{if(navigator.share){try{await navigator.share({title:`Join ${data?.name||'Fourth & Pick'}`,text:`🏈 Join my Fourth & Pick pool! Pool code: ${joinCode()}`,url:inviteUrl()})}catch(e){}}else copyInvite()};
window.emailInvite=()=>{location.href=`mailto:?subject=${encodeURIComponent('🏈 Join my Fourth & Pick pool')}&body=${encodeURIComponent(inviteMessage())}`};
window.textInvite=()=>{location.href=`sms:?&body=${encodeURIComponent(inviteMessage())}`};
$('#create').onclick=()=>createPoolModal();$('#invite').onclick=openInviteCenter;$('#signin').onclick=()=>{if(accountToken){pool=null;history.replaceState({},'',location.pathname);mainHome()}else accountModal('login')};$('#share').onclick=()=>pool?navigator.clipboard?.writeText(location.href).then(()=>alert('Pool link copied')):alert('Open a pool first');

// V8.3.2.2 Commissioner Communications Center
async function loadCommunicationsCenter(){try{const j=await api(`/api/leagues/${pool}/communications?pin=${encodeURIComponent(window.adminPin||'')}`),el=$('#communicationsCenter');if(!el)return;const checks=j.players.map(x=>`<label class="commPlayer"><input type="checkbox" class="commRecipient" value="${x.name.replace(/"/g,'&quot;')}" ${x.email?'checked':'disabled'}><span><b>${x.name}</b><small>${x.email||'No account email linked'}</small></span></label>`).join('');el.innerHTML=`<div class="commHero"><div><div class="eyebrow">COMMISSIONER COMMUNICATIONS</div><h2>📣 Communications Center</h2><p>Send league email and publish updates without leaving Commissioner HQ.</p></div><div class="commSignal">LIVE DESK</div></div><div class="commGrid"><section class="commBox"><h3>✉️ Send Email Notification</h3><label>Template<select id="commTemplate" class="input" onchange="applyCommTemplate()"><option value="custom">Custom message</option><option value="picks">Make Your Picks</option><option value="update">Pool Update</option><option value="results">Weekly Results</option><option value="schedule">Schedule Change</option></select></label><label>Subject<input id="commSubject" class="input" maxlength="140" placeholder="Fourth & Pick pool update"></label><label>Message<textarea id="commMessage" class="input" rows="6" placeholder="Write your message to the pool..."></textarea></label><label>Recipients<select id="commTarget" class="input" onchange="toggleCommRecipients()"><option value="all">Everyone with an email</option><option value="specific">Specific players</option></select></label><div id="commRecipients" class="commRecipients" style="display:none">${checks}</div><button class="btn primary commSend" onclick="sendCommissionerEmail()">📨 Send Email Notification</button><small class="muted">Local preview stores messages in the email outbox. Production uses the configured email provider.</small></section><section class="commBox"><h3>📢 Post Pool Update</h3><label>Headline<input id="postTitle" class="input" maxlength="100" placeholder="Week ${week} update"></label><label>Update<textarea id="postMessage" class="input" rows="6" placeholder="Post news, rules reminders, schedule information or league updates..."></textarea></label><label>Priority<select id="postPriority" class="input"><option value="normal">Normal</option><option value="important">Important</option><option value="urgent">Urgent</option></select></label><label class="commCheck"><input id="postPinned" type="checkbox" checked> Pin this update prominently</label><button class="btn primary" onclick="publishPoolUpdate()">📣 Publish Pool Update</button></section></div><div class="commGrid"><section class="commBox"><h3>📰 Recent Pool Updates</h3>${j.posts.length?j.posts.map(x=>`<div class="poolPost ${x.priority}"><div><span class="pill">${x.priority.toUpperCase()}</span> <b>${x.title}</b></div><p>${x.message}</p><small>${new Date(x.createdAt).toLocaleString()}</small><button class="miniDanger" onclick="deletePoolUpdate('${x.id}')">Delete</button></div>`).join(''):'<p class="muted">No pool updates posted yet.</p>'}</section><section class="commBox"><h3>🛡️ Communications Log</h3>${j.communications.length?j.communications.slice(0,12).map(x=>`<div class="commLog"><b>${x.type==='email'?'✉️':'📣'} ${x.subject}</b><small>${new Date(x.at).toLocaleString()} • ${x.count||0} recipient${x.count===1?'':'s'}</small></div>`).join(''):'<p class="muted">Nothing sent or posted yet.</p>'}</section></div>`}catch(e){const el=$('#communicationsCenter');if(el)el.innerHTML=`<div class="notice red">${e.message}</div>`}}
window.toggleCommRecipients=()=>{$('#commRecipients').style.display=$('#commTarget').value==='specific'?'grid':'none'};
window.applyCommTemplate=()=>{const t=$('#commTemplate').value,map={picks:[`Week ${week}: Make Your Picks`,`Week ${week} is open. Please finish your picks before each game's kickoff.`],update:[`Fourth & Pick Pool Update`,`Here's the latest update for our pool:`],results:[`Week ${week} Results`,`Week ${week} results are ready. Check the standings and weekly awards in Fourth & Pick.`],schedule:[`Week ${week} Schedule Update`,`Important schedule information for this week's games:`],custom:['','']};if(t!=='custom'){[$('#commSubject').value,$('#commMessage').value]=map[t]}};
window.sendCommissionerEmail=async()=>{try{const target=$('#commTarget').value,players=[...document.querySelectorAll('.commRecipient:checked')].map(x=>x.value);if(target==='specific'&&!players.length)return alert('Select at least one player.');const j=await post(`/api/leagues/${pool}/communications/email`,{pin:window.adminPin,subject:$('#commSubject').value,message:$('#commMessage').value,target,players});const n=j.results.filter(x=>x.status==='sent'||x.status==='preview').length;alert(`${n} email notification${n===1?'':'s'} ${j.mode==='live-email'?'sent':'added to the local outbox'} ✓`);loadCommunicationsCenter();loadReminderCenter()}catch(e){alert(e.message)}};
window.publishPoolUpdate=async()=>{try{await post(`/api/leagues/${pool}/communications/post`,{pin:window.adminPin,title:$('#postTitle').value,message:$('#postMessage').value,priority:$('#postPriority').value,pinned:$('#postPinned').checked});alert('Pool update published ✓');loadCommunicationsCenter();load()}catch(e){alert(e.message)}};
window.deletePoolUpdate=async(id)=>{if(!confirm('Delete this pool update?'))return;try{await post(`/api/leagues/${pool}/communications/post/${id}/delete`,{pin:window.adminPin});loadCommunicationsCenter()}catch(e){alert(e.message)}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{await refreshAccount();if(pool){try{await load()}catch(e){$('#status').textContent=e.message}}await mainHome()})();
</script></body></html>
